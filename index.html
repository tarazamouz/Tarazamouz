<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B3A57">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-title" content="ترازآموز">
<title>ترازآموز</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css">
<style>
:root{
  --paper:#F7F9F2; --ledger:#DCE7D6; --ink:#1B3A57; --text:#1E2B33; --muted:#586770;
  --rule:#C0392B; --pencil:#F0C94A; --pencil-bg:#FBF3D0; --ok:#2E7D4F; --ok-bg:#E3F1E7;
  --bad:#B5382B; --bad-bg:#FBE9E6; --line:#C4D1BF;
  --font:Vazirmatn,"Noto Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);font-size:16px;line-height:1.9;color:var(--text);
  background-color:var(--ledger);
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,rgba(27,58,87,.08) 31px,rgba(27,58,87,.08) 32px);}
#app{max-width:560px;margin:0 auto;padding:14px 14px calc(92px + env(safe-area-inset-bottom))}
h1{font-size:24px;line-height:1.5;margin:6px 0 6px;color:var(--ink);font-weight:800}
h2{font-size:18px;line-height:1.5;margin:22px 0 8px;color:var(--ink);font-weight:700}
h3{font-size:16px;margin:0 0 4px;color:var(--ink);font-weight:700}
p{margin:0 0 10px}
.muted{color:var(--muted);font-size:14px}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px;margin:0 0 10px}
.back{display:inline-block;background:none;border:0;color:var(--ink);font:inherit;font-size:14px;padding:6px 0;cursor:pointer;text-decoration:underline}
button{font-family:inherit}
.btn{display:block;width:100%;min-height:48px;border:0;border-radius:8px;background:var(--ink);color:#fff;font-size:16px;font-weight:700;padding:10px 16px;cursor:pointer}
.btn.alt{background:var(--paper);color:var(--ink);border:1.5px solid var(--ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px dashed var(--ink);min-height:44px}
.btn.danger{background:var(--paper);color:var(--bad);border:1.5px solid var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn+.btn{margin-top:8px}
.btns{display:flex;gap:8px;margin-top:10px}.btns .btn{margin:0}
:focus-visible{outline:3px solid var(--pencil);outline-offset:2px}

/* نوار بالا */
.topbar{position:sticky;top:0;z-index:4;background:var(--paper);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.topbar .in{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:6px 14px;min-height:50px}
.brand{display:flex;align-items:center;gap:8px;background:none;border:0;font:inherit;font-weight:800;font-size:19px;color:var(--ink);cursor:pointer;padding:0}
.brand svg{width:26px;height:26px}
.uchip{background:var(--ledger);border:1px solid var(--line);border-radius:99px;padding:2px 12px;font-size:13px;color:var(--ink);cursor:pointer;min-height:34px;font-family:inherit}

/* خانه */
.progress{height:8px;border-radius:99px;background:rgba(27,58,87,.15);overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;background:var(--ink);border-radius:99px}
.next{background:var(--ink);color:#fff;border:0;border-radius:10px;width:100%;text-align:right;padding:14px;margin:0 0 12px;font:inherit;cursor:pointer;display:block}
.next small{display:block;opacity:.8;font-size:13px}
.next b{display:block;font-size:17px;line-height:1.6}
details.level{background:var(--paper);border:1px solid var(--line);border-radius:10px;margin:0 0 10px;overflow:hidden}
details.level>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;font-weight:800;color:var(--ink);min-height:52px}
details.level>summary::-webkit-details-marker{display:none}
details.level>summary::after{content:"+";font-size:22px;font-weight:400;color:var(--muted);margin-inline-start:4px}
details.level[open]>summary::after{content:"−"}
details.level[open]>summary{border-bottom:1px solid var(--line);background:#fff}
.lv-in{padding:10px}
.lcard{display:flex;gap:12px;align-items:center;width:100%;text-align:right;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px;margin:0 0 8px;font:inherit;color:inherit;cursor:pointer}
.lcard:last-child{margin-bottom:0}
.num{flex:none;width:38px;height:38px;border-radius:6px;background:var(--ink);color:#fff;font-weight:800;display:grid;place-items:center;font-size:17px}
.lcard.done .num{background:var(--ok)}
.lcard h3{font-size:15px;line-height:1.7;margin:0}
.tag{display:inline-block;font-size:12px;padding:0 8px;border-radius:99px;background:var(--pencil-bg);border:1px solid var(--pencil);color:#6b5400;line-height:1.7}
.tag.done{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.count{font-size:13px;font-weight:400;color:var(--muted)}

/* درس */
.scene{border-inline-start:4px double var(--rule);padding:8px 12px;background:var(--paper);border-radius:6px;margin:0 0 10px}
.lab{font-weight:700;color:var(--ink);font-size:14px;display:block}
ul.tips{margin:0 0 10px;padding-inline-start:20px}
ul.tips li{margin-bottom:6px}
.ex{display:flex;align-items:center;gap:10px;width:100%;text-align:right;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 8px;font:inherit;color:inherit;cursor:pointer;min-height:48px}
.ex .st{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;font-weight:800}
.ex.done .st{background:var(--ok);border-color:var(--ok);color:#fff}

/* سند */
.sheet{background:var(--paper);border:1px solid var(--line);border-inline-start:4px double var(--rule);border-radius:10px;padding:12px;margin:10px 0}
.story{font-size:16px;margin:0 0 6px}
.row{position:relative;border-bottom:1px solid var(--line);padding:10px 0}
.row select,.row input,textarea,.fld input{width:100%;font:inherit;font-size:16px;color:var(--text);background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-height:44px}
textarea{min-height:92px;resize:vertical}
.amts{display:flex;gap:8px;margin-top:8px}
.amts label{flex:1;font-size:13px;color:var(--muted)}
.amts input{margin-top:2px;text-align:center;direction:ltr;font-variant-numeric:tabular-nums}
.row .x{position:absolute;top:8px;left:0;width:36px;height:36px;border:0;background:none;font-size:22px;color:var(--bad);cursor:pointer}
.row.has-x select{padding-left:40px}
.bal{display:flex;gap:6px;margin-top:10px;font-size:14px}
.bal div{flex:1;text-align:center;border-radius:6px;padding:4px 6px;background:rgba(27,58,87,.07)}
.bal .st{background:var(--pencil-bg);border:1px solid var(--pencil)}
.bal .st.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:700}
.fb{margin-top:12px}
.msg{border-radius:8px;padding:10px 12px;margin:0 0 8px;font-size:15px}
.msg.bad{background:var(--bad-bg);border:1px solid var(--bad);color:#7d241b}
.msg.good{background:var(--ok-bg);border:1px solid var(--ok);color:#1d5a37}
.msg.info{background:var(--pencil-bg);border:1px solid var(--pencil);color:#5c4900}
.msg ul{margin:4px 0 0;padding-inline-start:20px}
table{width:100%;border-collapse:collapse;background:#fff;font-size:15px}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:right;line-height:1.7}
th{background:var(--ink);color:#fff;font-weight:700}
td.n{text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
tfoot td{font-weight:800;background:var(--paper)}

/* دسته‌بندی و آزمون */
.item{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 8px}
.item.bad{border-color:var(--bad);background:var(--bad-bg)}
.item.ok{border-color:var(--ok);background:var(--ok-bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{min-height:40px;padding:4px 12px;border-radius:99px;border:1.5px solid var(--ink);background:#fff;color:var(--ink);font-size:14px;cursor:pointer;font-family:inherit}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.opt{display:block;width:100%;text-align:right;min-height:44px;margin-top:6px;padding:8px 12px;border-radius:8px;border:1.5px solid var(--line);background:#fff;color:var(--text);font:inherit;font-size:15px;line-height:1.7;cursor:pointer}
.opt[aria-pressed="true"]{border-color:var(--ink);background:#E9EFF5;font-weight:700}
.why{font-size:14px;color:var(--muted);margin-top:4px}
.fld{display:block;margin:0 0 8px;padding:10px 12px;background:var(--paper);border:1px solid var(--line);border-radius:10px}
.fld.ok{border-color:var(--ok);background:var(--ok-bg)}.fld.bad{border-color:var(--bad);background:var(--bad-bg)}
.fld span{display:block;font-size:15px;margin-bottom:4px}
.fld input{direction:ltr;text-align:center;font-variant-numeric:tabular-nums}

/* دفتر من */
.tabs{display:flex;gap:6px;margin:10px 0}
.tabs button{flex:1;min-height:44px;border-radius:8px;border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);font-weight:700;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:#fff}
.t2{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);background:#fff;border-radius:6px;overflow:hidden;margin-top:6px}
.t2>div{padding:6px 8px;min-height:30px}
.t2>div:first-child{border-inline-end:1px solid var(--line)}
.t2 b{display:block;font-size:13px;color:var(--muted)}
.t2 span{display:block;font-variant-numeric:tabular-nums}

/* حساب */
.auth{max-width:420px;margin:0 auto;padding-top:20px}
.auth .logo{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:12px}
.auth .logo svg{width:64px;height:64px}
.field{margin:0 0 10px}
.field label{display:block;font-weight:700;font-size:14px;color:var(--ink)}
.field input[type=text],.field input[type=password]{width:100%;font:inherit;font-size:17px;border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-height:46px;background:#fff;direction:ltr;text-align:left}
.field .hint{font-size:13px;color:var(--muted)}
.inline{display:flex;gap:8px;align-items:flex-end}.inline .field{flex:1;margin:0}.inline .btn{width:auto;min-height:46px;padding:0 14px;font-size:14px}
.sw{display:flex;align-items:center;gap:8px;font-size:14px;margin:4px 0 10px}.sw input{width:20px;height:20px}

/* نوار پایین */
nav.bar{position:fixed;inset-inline:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.bar button{flex:1;min-height:60px;background:none;border:0;color:var(--muted);font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;font-family:inherit}
nav.bar button[aria-current="page"]{color:var(--ink);font-weight:800;box-shadow:inset 0 3px 0 var(--rule)}
nav.bar svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.toast{position:fixed;inset-inline:16px;bottom:84px;margin:0 auto;max-width:420px;background:var(--ink);color:#fff;padding:10px 14px;border-radius:8px;text-align:center;z-index:9}
.warn{background:var(--pencil-bg);border:1px solid var(--pencil);border-radius:8px;padding:8px 12px;margin:0 0 10px;font-size:14px}
input.name{width:100%;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-height:44px;margin:6px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="topbar" id="top" hidden><div class="in">
  <button class="brand" data-a="go" data-to="" aria-label="ترازآموز، صفحه‌ی اصلی">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="6" fill="#1B3A57"/><rect x="7" y="7" width="18" height="18" rx="2" fill="#F7F9F2"/><path d="M11 12h10M11 16h10M11 20h10" stroke="#C4D1BF" stroke-width="1.5"/><path d="M21 7v18M23 7v18" stroke="#C0392B" stroke-width="1.2"/></svg>ترازآموز</button>
  <button class="uchip" id="uchip" data-a="go" data-to="me"></button>
</div></header>
<main id="app" aria-live="polite"></main>
<nav class="bar" id="nav" aria-label="منوی اصلی" hidden>
  <button data-a="go" data-to="" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>درس‌ها</button>
  <button data-a="go" data-to="books" data-tab="books"><svg viewBox="0 0 24 24"><path d="M5 4h12a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2z"/><path d="M9 8h6M9 12h6"/></svg>دفتر من</button>
  <button data-a="go" data-to="me" data-tab="me"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>من</button>
</nav>
<noscript>برای استفاده از این برنامه باید جاوااسکریپت فعال باشد.</noscript>

<script src="content.js"></script>
<script src="engine.js"></script>
<script src="auth.js"></script>
<script src="app.js"></script>
</body>
</html>
